<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wandr — Trip Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root"></div>

<!-- React -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<!-- Babel standalone — transforms text/babel scripts only -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!--
  Firebase via ESM CDN.
  IMPORTANT: type="module" so the browser (not Babel) handles the imports.
  Babel only processes scripts with type="text/babel", so this is safe.
-->
<script type="module">
  import * as firebaseApp       from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import * as firebaseAuth      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
  import * as firebaseFirestore from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  // Expose on window so the Babel-compiled app.js can destructure from them
  window.firebaseApp       = firebaseApp;
  window.firebaseAuth      = firebaseAuth;
  window.firebaseFirestore = firebaseFirestore;

  // Fetch app.js source, inject as a text/babel script so Babel transforms it
  const res  = await fetch('app.js');
  const code = await res.text();

  const script = document.createElement('script');
  script.type        = 'text/babel';
  script.dataset.presets = 'react';   // tell Babel standalone to use the React preset
  script.textContent = code;
  document.body.appendChild(script);

  // Babel standalone auto-transforms any text/babel scripts added to the DOM
  Babel.transformScriptTags();
</script>

</body>
</html>
